    <h1>Telemetry</h1>
    <p class="lead">Off until you say yes. The onboard screen prints the JSON. Honor <code>DO_NOT_TRACK=1</code>.</p>
    <p>Never domains, URLs, queries, keys, or IPs. Single call site: <code>recordEvent</code>.</p>
    <pre class="install">sean telemetry off
sean telemetry status --json</pre>
  </main>
