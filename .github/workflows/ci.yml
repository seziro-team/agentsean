name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. Without an explicit block a workflow inherits the repository
# default, which on many repos is read/write on every scope — a compromised
# action in the tree would then be able to push. CI only ever needs to read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm --filter "./packages/**" build

      - name: Typecheck
        run: pnpm --filter "./packages/**" typecheck

      - name: Test
        run: pnpm test

  install-smoke:
    name: Install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installer flags
        run: |
          bash install/install.sh --help
          bash install/install.sh --dry-run --from-source "$PWD" --prefix /tmp/sean-smoke --no-onboard
      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: From-source shim + doctor
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          bash install/install.sh --from-source "$PWD" --prefix /tmp/sean-smoke --no-onboard
          /tmp/sean-smoke/bin/sean doctor --json --home /tmp/sean-smoke-home
          /tmp/sean-smoke/bin/sean --version

  cloud:
    name: Cloud app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      # No secrets are provided on purpose. The app must build and run with
      # every integration unconfigured, so a contributor can work on it without
      # a Supabase project or a billing account.
      - name: Build with an empty environment
        run: pnpm --filter @agentsean/cloud build

      - name: Typecheck
        run: pnpm --filter @agentsean/cloud typecheck
