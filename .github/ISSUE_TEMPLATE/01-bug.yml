name: Bug report
description: Something in Sean is broken or behaves differently than documented.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. A clear reproduction is the single
        biggest factor in how fast this gets fixed.

        If Sean made a change to your live site that you did not want, do **not** use this
        form — run `sean freeze` first and open a **"Sean made a bad change on my site"**
        report instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description:
        A clear, concise description of the bug and how it differs from what you
        expected.
      placeholder:
        Running `sean measure` exits with a stack trace after the Search Console step.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description:
        The exact commands and conditions that trigger the bug. Number each step.
      placeholder: |
        1. Fresh install via `npx agentsean onboard`
        2. Connect Search Console for one property
        3. Run `sean measure`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`sean doctor --json` output"
      description: >
        Run `sean doctor --json` and paste the output here. This captures your version,
        platform, adapter state, and daemon bind config. Redact anything that looks like
        a token, secret, hostname you would rather not share, or customer domain.
      render: json
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5 / Ubuntu 24.04 / Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.19.0"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sean version
      description: Output of `sean --version`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install Sean?
      options:
        - npx
        - curl installer (install.sh)
        - Docker
        - Homebrew
        - From source
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Self-hosted
        - Hosted cloud
    validations:
      required: true

  - type: dropdown
    id: adapter
    attributes:
      label: Which CMS / platform adapter is in use?
      options:
        - None
        - WordPress
        - Shopify
        - Git
        - Cloudflare edge
        - Webflow
        - Ghost
        - Wix
        - BigCommerce
        - Headless / custom
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >
        Paste any additional daemon logs, error output, or screenshots. Fenced code
        blocks stay readable. Redact secrets.
      render: shell

  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmation
      options:
        - label:
            I have not included any credentials, API keys, tokens, or other secrets in
            this report.
          required: true
