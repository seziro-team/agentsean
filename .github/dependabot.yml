version: 2
updates:
  # GitHub Actions used by our workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # npm dependencies across the root and every workspace package.
  # `directories` globbing keeps this one block covering all 27 packages
  # plus the root, instead of 28 near-identical entries.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
      - /packages/adapters/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
